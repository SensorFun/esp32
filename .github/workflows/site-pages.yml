name: Build firmware and deploy ESP32 site

# Builds every board in config/boards with the same script used locally
# (tools/firmware_artifacts.py), bundles the packages into the site, and
# deploys GitHub Pages from main. Pull requests build and test only.
on:
  push:
    branches: [main]
    paths: &paths
      - 'site/**'
      - 'config/**'
      - 'boards/**'
      - 'cmake/**'
      - 'projects/**'
      - 'python/**'
      - 'tools/build.py'
      - 'tools/_docker.py'
      - 'tools/firmware_artifacts.py'
      - 'tests/**'
      - '.github/workflows/site-pages.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Install the workspace package as the README instructs, so tools run from any directory.
      - run: python -m pip install -e '.[flash]' pytest
      - run: python -m pytest tests --ignore=tests/e2e -q

  boards:
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.list.outputs.pairs }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install PyYAML
      - id: list
        run: echo "pairs=$(python3 tools/firmware_artifacts.py --list)" >> "$GITHUB_OUTPUT"

  firmware:
    needs: boards
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.boards.outputs.pairs) }}
    env:
      ESP32_IN_DOCKER: '1'
    steps:
      - uses: actions/checkout@v4
      # --release refuses any build not compiled for performance (-O2).
      - name: Build and package ${{ matrix.project }} / ${{ matrix.board }}
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python -m pip install --quiet hydra-core==1.3.2
          python tools/firmware_artifacts.py --project "${{ matrix.project }}" --board "${{ matrix.board }}" --commit "${GITHUB_SHA::12}" --release
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.project }}-${{ matrix.board }}
          path: build/firmware
          if-no-files-found: error
          retention-days: 30

  site:
    needs: [firmware, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: build/firmware
      - name: Install dependencies
        run: npm ci
        working-directory: site
      - name: Test site
        run: npm test
        working-directory: site
      - uses: actions/configure-pages@v5
        id: pages
        if: github.event_name != 'pull_request'
      # Path routes need the Pages base path ('' on the custom domain).
      - name: Build site
        run: npm run build -- --base "${{ steps.pages.outputs.base_path }}/"
        working-directory: site
      - name: Check bundled firmware
        run: node scripts/check-bundle.mjs dist --all-boards
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: site
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
