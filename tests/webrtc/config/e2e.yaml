# Hardware e2e fixture: the boards expected to be connected for
# tests/webrtc/e2e, and where to reach the public signaling server and browser.
# Edit `devices` to match the device profiles (config/device/*.yaml) you
# have physically connected; USB ports are auto-detected per board by
# tools/flash.py's own identity matching (config/device/*.yaml),
# since ports can change between runs.
devices: [esp32_cam, esp32s3_wroom, esp32s3_goouuu]
# Installed Chromium executable; required, no auto-detection.
browser: /root/.cache/ms-playwright/chromium-1255/chrome-linux64/chrome
