services:
  signaling:
    build: .
    networks: [signaling]
    user: "${SIGNAL_SERVER_UID}:${SIGNAL_SERVER_GID}"
    secrets: [signaling_api_secret]
    image: esp32-signaling:local
    volumes:
      - type: bind
        source: ./server.py
        target: /opt/signaling/server.py
        read_only: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    networks: [signaling]
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yaml
      - run
      - ${CLOUDFLARE_TUNNEL_ID}
    user: "${SIGNAL_SERVER_UID}:${SIGNAL_SERVER_GID}"
    secrets: [cloudflare_credentials]
    volumes:
      - type: bind
        source: ./cloudflared.yaml
        target: /etc/cloudflared/config.yaml
        read_only: true
    depends_on: [signaling]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  signaling:
    driver: bridge

secrets:
  signaling_api_secret:
    file: ${SIGNALING_SECRET_FILE}
  cloudflare_credentials:
    file: ${CLOUDFLARE_CREDENTIALS_FILE}
