# OV2640 controls that differ from the shared OV settings in ../ov.yaml.
# Ranges come from the pinned esp32-camera driver (2.1.6, sensors/ov2640.c).
# The driver does not implement sharpness or denoise on the OV2640.
name: ov2640
controls:
  brightness: {default: 0, options: [-2, -1, 0, 1, 2]}
  contrast: {default: 0, options: [-2, -1, 0, 1, 2]}
  saturation: {default: 0, options: [-2, -1, 0, 1, 2]}
  # COM9 AGC ceiling, gainceiling_t: 2x to 128x.
  gain_ceiling: {default: 0, options: {0: 2x, 1: 4x, 2: 8x, 3: 16x, 4: 32x, 5: 64x, 6: 128x}}
  # Index into the driver's gain table: 0 = 1x ... 30 = 31x.
  agc_gain: {default: 0, range: [0, 30]}
  aec_value: {default: 300, range: [0, 1200]}
  ae_level: {default: 0, options: [-2, -1, 0, 1, 2]}
