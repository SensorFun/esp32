# OV2640 camera controls: allowed values and defaults.
#
# Ranges come from the pinned esp32-camera driver (2.1.6, sensors/ov2640.c)
# and agree with Espressif's CameraWebServer limits. The firmware detects the
# sensor at runtime and offers exactly these controls in the settings panel:
#   switch: true      -> an On/Off switch (0 = Off, 1 = On)
#   options: [...]    -> a list of numbers, or {value: label} for named values
#   range: [min, max] -> a number field, for controls with many values
# The driver does not implement sharpness or denoise on the OV2640.
name: ov2640
timing_profile: mid_light
controls:
  brightness: {default: 0, options: [-2, -1, 0, 1, 2]}
  contrast: {default: 0, options: [-2, -1, 0, 1, 2]}
  saturation: {default: 0, options: [-2, -1, 0, 1, 2]}
  # The driver accepts 0-63 (lower is better quality, larger frames).
  jpeg_quality: {default: 12, range: [2, 63]}
  # COM9 AGC ceiling, gainceiling_t: 2x to 128x.
  gain_ceiling: {default: 0, options: {0: 2x, 1: 4x, 2: 8x, 3: 16x, 4: 32x, 5: 64x, 6: 128x}}
  colorbar: {default: 0, switch: true}
  horizontal_mirror: {default: 0, switch: true}
  vertical_flip: {default: 0, switch: true}
  automatic_white_balance: {default: 1, switch: true}
  awb_gain: {default: 1, switch: true}
  white_balance_mode: {default: 0, options: {0: Auto, 1: Sunny, 2: Cloudy, 3: Office, 4: Home}}
  automatic_gain: {default: 1, switch: true}
  # Index into the driver's gain table: 0 = 1x ... 30 = 31x.
  agc_gain: {default: 0, range: [0, 30]}
  automatic_exposure: {default: 1, switch: true}
  aec_value: {default: 300, range: [0, 1200]}
  ae_level: {default: 0, options: [-2, -1, 0, 1, 2]}
  aec2: {default: 0, switch: true}
  downsize: {default: 1, switch: true}
  black_pixel_correction: {default: 0, switch: true}
  white_pixel_correction: {default: 1, switch: true}
  raw_gamma: {default: 1, switch: true}
  lens_correction: {default: 1, switch: true}
