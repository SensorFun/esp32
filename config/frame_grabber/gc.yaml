name: gc
# GC sensors this frame grabber family supports. Each sensor's controls,
# allowed values and defaults are in sensors/<sensor>.yaml; the firmware
# detects the installed sensor at runtime and uses its profile.
sensors: [gc0308]
common:
  # Stream resolution (WIDTHxHEIGHT) until saved settings select another; the
  # settings panel's Default button returns to it. The GC0308 has no hardware
  # JPEG: at 640x480 (its largest) raw capture and software encoding timed out
  # after a reboot with that default saved, and the viewer could not connect.
  default_resolution: 320x240
