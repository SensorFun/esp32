name: gc
# GC0308 controls implemented by the camera driver. RGB565 frames are encoded
# to JPEG in software; sensor JPEG quality and OV light timing do not apply.
contrast: 0
saturation: 0
sharpness: 0
colorbar: 0
horizontal_mirror: 0
vertical_flip: 0
automatic_white_balance: 1
white_balance_mode: 0
automatic_gain: 1
# Driver maps 10 to register 0x15, close to the GC0308 default 0x14.
# Zero writes zero global gain and produces a dark image even with AGC enabled.
agc_gain: 10
automatic_exposure: 1
aec_value: 300
ae_level: 0
