# Select a board/sensor pair with device=...; project and board remain overridable.
defaults:
  - device: esp32_cam_ov2640_62
  - _self_

project: hello_world
camera_sensor: ${frame_grabber.sensor}
dry_run: false

hydra:
  run:
    dir: ${hydra.runtime.cwd}/build/hydra/${hydra.job.name}
  sweep:
    dir: ${hydra.runtime.cwd}/build/hydra/${hydra.job.name}/multirun
  output_subdir: null
  job:
    chdir: false
