# Select a board/frame grabber pair with device=...; project and board remain overridable.
defaults:
  - boards@board_catalog: [ai-thinker, espressif, goouuu]
  - device: esp32_cam
  - _self_

hardware: ${board_catalog.${board}}
project: webrtc
dry_run: false

hydra:
  run:
    dir: ${hydra.runtime.cwd}/build/hydra/${hydra.job.name}
  sweep:
    dir: ${hydra.runtime.cwd}/build/hydra/${hydra.job.name}/multirun
  output_subdir: null
  job:
    chdir: false
