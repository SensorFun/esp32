[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-workspace"
version = "0.1.0"
description = "Python tools for native ESP-IDF firmware projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["hydra-core>=1.3.2,<1.4"]

[project.optional-dependencies]
dev = ["pre-commit>=4,<5"]
flash = ["esptool>=5,<6", "pyserial>=3.5,<4"]

[project.scripts]
esp32 = "esp32_workspace.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
